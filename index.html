<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <!-- link css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="calc">
      <input type="text" id="input" placeholder="0">
      <button class="silverbtn" onclick="calculate()">AC</button>
      <button class="silverbtn" onclick="calculate()">Del</button>
      <button class="bluebtn" onclick="calculate('.')">.</button>
      <button class="bluebtn" onclick="calculate('/')">/</button>
      <button onclick="calculate('*')">1</button>
      <button onclick="calculate()">2</button>
      <button onclick="calculate()">3</button>
      <button class="bluebtn" onclick="calculate()">*</button>
      <button onclick="calculate()">4</button>
      <button onclick="calculate()">5</button>
      <button onclick="calculate()">6</button>
      <button class="bluebtn" onclick="calculate()">-</button>
      <button onclick="calculate()">7</button>
      <button onclick="calculate()">8</button>
      <button onclick="calculate()">9</button>
      <button class="bluebtn" onclick="calculate()">+</button>
      <button onclick="calculate()">00</button>
      <button onclick="calculate()">0</button>
      <button class="equalbtn" onclick="calculate()">=</button>
    </div>
  </div>
</body>
</html>
